<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SomeGame 逃离撤离点</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="screen-lobby">
    <h1>SomeGame · 逃离撤离点</h1>
    <div class="card-panel">
      <h3>创建房间</h3>
      <label>昵称 <input id="create-name" value="房主" /></label>
      <label>人数
        <select id="create-players"><option value="4">4（推荐）</option><option value="8">8</option></select>
      </label>
      <button id="btn-create">创建</button>
    </div>
    <div class="card-panel">
      <h3>加入房间</h3>
      <label>昵称 <input id="join-name" value="玩家" /></label>
      <label>房间号 <input id="join-room" placeholder="如 R0" /></label>
      <button id="btn-join">加入</button>
    </div>
  </div>

  <div id="screen-lobby-wait" style="display:none">
    <h2>房间 <span id="lobby-room"></span></h2>
    <div id="lobby-seats"></div>
    <p id="lobby-hint"></p>
    <button id="btn-start" style="display:none">开始游戏（空位由机器人补齐）</button>
  </div>

  <div id="screen-game" style="display:none">
    <div id="topbar">
      <span>回合 <b id="s-round"></b></span>
      <span>阶段 <b id="s-stage"></b></span>
      <span>HP <b id="s-hp"></b></span>
      <span>行动点 <b id="s-ap"></b></span>
      <span>贵宾距撤离 <b id="s-countdown"></b> 格</span>
    </div>
    <div id="objective"></div>
    <div id="effects"></div>
    <div id="main">
      <div id="board-wrap"><div id="board"></div></div>
      <div id="side">
        <div id="battle-panel"></div>
        <div id="cell-title">所在格</div>
        <div id="cell-panel"></div>
        <div id="hand-title">手牌</div>
        <div id="hand"></div>
        <div id="actions"></div>
        <div id="logs"></div>
      </div>
    </div>
  </div>
</div>
<div id="overlay" style="display:none"><div id="overlay-box"></div></div>
<script src="app.js"></script>
</body>
</html>
